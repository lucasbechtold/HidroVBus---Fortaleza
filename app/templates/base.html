<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HidroVBus — Mobilidade Sustentável em Fortaleza{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#00A859',
                            lightgreen: '#8DC63F',
                            blue: '#0055A5',
                            yellow: '#FFC72C',
                            dark: '#1E293B'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="flex items-center gap-2 font-bold text-xl text-brand-green">
                        <i class="fa-solid font-bold fa-bus-simple text-brand-lightgreen text-2xl"></i>
                        Hidro<span class="text-brand-blue">VBus</span>
                    </a>
                    <div class="hidden md:flex ml-10 space-x-6 text-sm font-medium">
                        <a href="/" class="hover:text-brand-green">Rotas</a>
                        <a href="/sobre" class="hover:text-brand-green">O Projeto</a>
                        <a href="/hidrogenio-verde" class="hover:text-brand-green">Hidrogênio Verde</a>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/" class="bg-brand-green hover:bg-emerald-600 text-white font-semibold text-sm px-4 py-2 rounded-lg shadow-sm">
                        Planejar Viagem
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-brand-dark text-slate-300 py-8 border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs space-y-2">
            <p><strong>HidroVBus Fortaleza</strong> — Projeto de Inovação e Transporte Público de Baixo Carbono.</p>
            <p class="text-slate-400">Desenvolvido com foco em sustentabilidade, dados abertos e mobilidade urbana.</p>
        </div>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
